<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>404 Not Found | SAINTCON Badge Museum</title>
  <link rel="stylesheet" href="/museum-art/theme.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--silk);
      font-family: var(--sans);
      line-height: 1.55;
    }
    a { color: var(--gold); text-underline-offset: 3px; }
    a:hover { color: var(--silk); }
    :focus-visible { outline: 3px solid var(--silk); outline-offset: 3px; }
    .card { position: relative; isolation: isolate; width: 100%; max-width: 520px; padding: 32px 24px 24px; }
    .card::before, .card::after {
      content: "";
      position: absolute;
      z-index: -1;
      clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    }
    .card::before { inset: 0; background: var(--line); }
    .card::after {
      inset: 1px;
      background:
        radial-gradient(circle at calc(100% - 16px) 16px, var(--gold) 0 3px, transparent 3.5px),
        radial-gradient(circle at 16px calc(100% - 16px), var(--gold) 0 3px, transparent 3.5px),
        var(--mask-raised);
    }
    .code { margin: 0; font: 700 clamp(4.5rem, 24vw, 8rem)/0.95 var(--display); color: var(--gold); letter-spacing: 0.01em; }
    .msg { margin: 12px 0 24px; font: 500 0.95rem/1.5 var(--mono); color: var(--silk); }
    .pad {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 24px;
      font: 700 1rem/1.2 var(--display);
      letter-spacing: 0.03em;
      text-decoration: none;
      color: var(--mask);
    }
    .pad:hover { color: var(--mask); }
    .pad::before, .pad::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    .pad::before { background: var(--gold); }
    .pad:hover::before { filter: brightness(1.15); }
    .pad::after { display: none; }
    .pad.outline { color: var(--silk); }
    .pad.outline:hover { color: var(--gold); }
    .pad.outline::after {
      display: block;
      inset: 2px;
      background: var(--mask);
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .pad.small { min-width: 64px; min-height: 44px; padding: 8px 12px; font-size: 1rem; }
    .years { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 22px 0 24px; }
    .disclaimer { margin: 0 0 8px; font: 400 0.76rem/1.5 var(--mono); color: var(--muted); }
    .disclaimer:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="code">404</h1>
    <p class="msg">Page not found. Nothing is connected at this address.</p>
    <a class="pad" id="link-museum" href="/museum.html">Badge Museum</a>
    <div class="years" aria-label="Badge years">
        <a class="pad outline small" id="link-2026" href="/?year=2026">2026</a>
        <a class="pad outline small" id="link-2025" href="/?year=2025">2025</a>
        <a class="pad outline small" id="link-2024" href="/?year=2024">2024</a>
        <a class="pad outline small" id="link-2023" href="/?year=2023">2023</a>
        <a class="pad outline small" id="link-2022" href="/?year=2022">2022</a>
        <a class="pad outline small" id="link-2021" href="/?year=2021">2021</a>
        <a class="pad outline small" id="link-2020" href="/?year=2020">2020</a>
        <a class="pad outline small" id="link-2019" href="/?year=2019">2019</a>
        <a class="pad outline small" id="link-2018" href="/?year=2018">2018</a>
        <a class="pad outline small" id="link-2017" href="/?year=2017">2017</a>
    </div>
    <p class="disclaimer">Unofficial fan project. Not affiliated with or endorsed by SAINTCON or UtahSAINT.</p>
    <p class="disclaimer"><a href="https://saintcon.org/" target="_blank" rel="noopener">SAINTCON</a> · <a href="https://www.utahsaint.org/" target="_blank" rel="noopener">UtahSAINT</a></p>
  </div>
  <script>
    (function () {
      var host = (window.location.hostname || '').toLowerCase();
      if (host === 'sc.pug.technology' || host.endsWith('.sc.pug.technology')) {
        var lMuseum = document.getElementById('link-museum');
        var l2017 = document.getElementById('link-2017');
        var l2018 = document.getElementById('link-2018');
        var l2019 = document.getElementById('link-2019');
        var l2020 = document.getElementById('link-2020');
        var l2021 = document.getElementById('link-2021');
        var l2022 = document.getElementById('link-2022');
        var l2023 = document.getElementById('link-2023');
        var l2024 = document.getElementById('link-2024');
        var l2025 = document.getElementById('link-2025');
        var l2026 = document.getElementById('link-2026');
        if (lMuseum) lMuseum.href = 'https://sc.pug.technology/';
        if (l2017) l2017.href = 'https://17.sc.pug.technology/';
        if (l2018) l2018.href = 'https://18.sc.pug.technology/';
        if (l2019) l2019.href = 'https://19.sc.pug.technology/';
        if (l2020) l2020.href = 'https://20.sc.pug.technology/';
        if (l2021) l2021.href = 'https://21.sc.pug.technology/';
        if (l2022) l2022.href = 'https://22.sc.pug.technology/';
        if (l2023) l2023.href = 'https://23.sc.pug.technology/';
        if (l2024) l2024.href = 'https://24.sc.pug.technology/';
        if (l2025) l2025.href = 'https://25.sc.pug.technology/';
        if (l2026) l2026.href = 'https://26.sc.pug.technology/';
      }
    })();
  </script>
</body>
</html>
